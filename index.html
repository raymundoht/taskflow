<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main>
    <h1>TaskFlow</h1>
    <form id="form">
      <label for="title">Nueva tarea</label>
      <input id="title" maxlength="200" autocomplete="off" required>
      <button type="submit">Agregar</button>
    </form>
    <p id="error" role="alert"></p>
    <nav aria-label="Filtros">
      <button data-filter="all">Todas</button>
      <button data-filter="active">Pendientes</button>
      <button data-filter="done">Hechas</button>
    </nav>
    <ul id="list"></ul>
    <p id="summary"></p>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
