name: CI

# Se ejecuta automáticamente en cada Pull Request hacia main y en cada push a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:            # Este nombre ("test") es el status check obligatorio en la protección de main.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests (normal, edge and invalid cases)
        run: npm test

      - name: Verify production build
        run: npm run build
